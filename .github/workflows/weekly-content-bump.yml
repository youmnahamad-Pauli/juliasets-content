# .github/workflows/weekly-content-bump.yml
#
# Runs every Sunday at 06:00 UAE time (02:00 UTC).
# Bumps manifest.json version + updated_at date, then opens a PR.
# Youmna reviews and merges to approve — app picks up new content
# within 7 days of the next user launch.

name: Weekly content bump

on:
  schedule:
    # 02:00 UTC = 06:00 UAE (UTC+4)
    - cron: '0 2 * * 0'
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bump manifest version and date
        run: |
          node - << 'EOF'
          const fs = require('fs');
          const path = './manifest.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));

          // Increment patch version (e.g. 1.0.0 → 1.0.1)
          const parts = manifest.version.split('.').map(Number);
          parts[2] += 1;
          manifest.version = parts.join('.');

          // Update date to today (UAE date)
          const now = new Date();
          const uaeDate = new Date(now.getTime() + 4 * 60 * 60 * 1000);
          manifest.updated_at = uaeDate.toISOString().split('T')[0];

          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          console.log(`Bumped to v${manifest.version} on ${manifest.updated_at}`);
          EOF

      - name: Get new version
        id: version
        run: echo "version=$(node -e "console.log(require('./manifest.json').version)")" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: weekly content bump v${{ steps.version.outputs.version }}"
          title: "📅 Weekly content update — v${{ steps.version.outputs.version }}"
          body: |
            ## Weekly content bump

            This PR was auto-generated by the weekly content workflow.

            **What changed:**
            - `manifest.json` version bumped to `v${{ steps.version.outputs.version }}`
            - `updated_at` date refreshed

            **To add new fun facts this week:**
            1. Edit `facts/facts_en.json` — add your new fact object at the end
            2. Edit `facts/facts_ar.json` — add the Arabic translation
            3. Merge this PR

            The app will pick up the new content within 7 days of the next user launch.

            ---
            *Merge to approve · Close to skip this week*
          branch: "weekly-bump/v${{ steps.version.outputs.version }}"
          delete-branch: true
